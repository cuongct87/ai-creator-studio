[package]
name = "artio-desktop"
version = "1.0.0"
description = "Artio — thiết kế thiệp, bảng hiệu, bài bán hàng (bản Windows)"
edition = "2021"
publish = false

[lib]
name = "artio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Bản cài nhỏ hơn.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
