name: Open Council offline pilot tests
on:
  pull_request:
    paths:
      - 'open-council/**'
      - '.github/workflows/open-council-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests (no provider secrets)
        working-directory: open-council
        run: python -m unittest -v
