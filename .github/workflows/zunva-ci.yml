name: ZUNVA CI

# Kiểm tra mã ZUNVA mới (thư mục zunva/): lint, kiểu, unit test, build, test giao diện 360px.
on:
  pull_request:
    paths:
      - "zunva/**"
      - ".github/workflows/zunva-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zunva-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: zunva
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: zunva/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài thư viện
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "Chưa có pnpm-lock.yaml: cài lần đầu và in file khóa ra log để commit."
            pnpm install --no-frozen-lockfile
            echo "::group::pnpm-lock.yaml (sao chép vào repo)"
            echo "ZUNVA-LOCKFILE-BEGIN"
            cat pnpm-lock.yaml
            echo "ZUNVA-LOCKFILE-END"
            echo "::endgroup::"
          fi

      - name: Lint (gồm luật lõi không gọi giao diện)
        run: pnpm lint

      - name: Thử vi phạm luật lõi (lint phải báo lỗi)
        run: |
          printf "import React from 'react';\nexport const leak = React;\n" > packages/core/src/__boundary_check__.ts
          if pnpm exec eslint packages/core/src/__boundary_check__.ts; then
            echo "LỖI: lint không chặn được core import React"; rm packages/core/src/__boundary_check__.ts; exit 1
          fi
          printf "export const leak = document.title;\n" > packages/core/src/__boundary_check__.ts
          if pnpm exec eslint packages/core/src/__boundary_check__.ts; then
            echo "LỖI: lint không chặn được core dùng document"; rm packages/core/src/__boundary_check__.ts; exit 1
          fi
          rm packages/core/src/__boundary_check__.ts
          echo "Đạt: lint chặn được cả import React lẫn document trong core."

      - name: Kiểm tra kiểu TypeScript
        run: pnpm typecheck

      - name: Unit test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Cài trình duyệt cho Playwright
        run: pnpm --filter @zunva/web exec playwright install --with-deps chromium

      - name: Test giao diện khổ 360px
        run: pnpm e2e

      - name: Lưu báo cáo khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: zunva/apps/web/test-results
          if-no-files-found: ignore
