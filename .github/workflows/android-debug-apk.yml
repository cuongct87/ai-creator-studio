name: ZUNVA Android debug APK

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-debug-apk.yml'
      - 'index.html'
      - 'script.js'
      - 'studio_v15.js'
      - 'style.css'
      - 'vault_i18n.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35 with runner's preinstalled SDK tools
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          if [ -z "$SDKMGR" ]; then echo "sdkmanager not found"; exit 1; fi
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      - name: Syntax-check main Studio scripts
        run: |
          node --check script.js
          node --check studio_v15.js
          node --check vault_i18n.js

      - name: Capture mobile Studio preview (headless Chrome)
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$CHROME" ]; then
            "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars \
              --window-size=430,1150 --virtual-time-budget=3000 \
              --screenshot="$PWD/zunva-mobile-preview.png" "file://$PWD/index.html"
          else
            echo "Chrome not installed; preview screenshot unavailable."
          fi

      - name: Upload Studio preview screenshot
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('zunva-mobile-preview.png') != '' }}
        with:
          name: ZUNVA-Studio-Mobile-Preview
          path: zunva-mobile-preview.png
          retention-days: 14

      - name: Build debug APK
        working-directory: android
        run: bash ./gradlew :app:assembleDebug --no-daemon

      - name: Verify exactly five APK assets match canonical sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          apk = Path('android/app/build/outputs/apk/debug/app-debug.apk')
          required = ['index.html', 'script.js', 'studio_v15.js', 'style.css', 'vault_i18n.js']
          with ZipFile(apk) as z:
              asset_names = {n for n in z.namelist() if n.startswith('assets/') and not n.endswith('/')}
              expected = {f'assets/{name}' for name in required}
              if asset_names != expected:
                  raise SystemExit(f'Unexpected APK assets: {sorted(asset_names)} (expected {sorted(expected)})')
              for name in required:
                  if z.read(f'assets/{name}') != Path(name).read_bytes():
                      raise SystemExit(f'APK asset content differs from repo source: {name}')
          print('Verified exactly five APK assets; byte-identical to canonical root files.')
          PY

      - name: Verify debug-only app identity
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\\n' "$BADGING" | grep -E '^(package:|application:)'
          printf '%s\\n' "$BADGING" | grep -F "package: name='vn.iaysystem.aicreatorstudio.test'"
          printf '%s\\n' "$BADGING" | grep -F "label='AI Creator Studio TEST'"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ZUNVA-AI-Creator-Studio-TEST-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
