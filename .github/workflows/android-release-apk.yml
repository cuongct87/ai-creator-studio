name: ZUNVA Android release APK (signed)

# G1-1: build a release APK for package vn.c87.lsc and sign it with the single ZUNVA
# release key. Manual only. Never publishes to a store.
# The keystore lives only on the founder's machine and in GitHub Secrets:
#   ZUNVA_KEYSTORE_B64, ZUNVA_KEYSTORE_PASSWORD, ZUNVA_KEY_ALIAS, ZUNVA_KEY_PASSWORD
# Secrets are passed through environment variables only and are never echoed.
on:
  workflow_dispatch:
    inputs:
      ban_kiem_tra:
        description: 'Bản kiểm tra: cho máy tính điều khiển app qua USB (chỉ để thử, KHÔNG phát hành)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-release-apk
  cancel-in-progress: false

env:
  EXPECTED_PACKAGE: vn.c87.lsc

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android build-tools
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          if [ ! -x "$BT/apksigner" ]; then echo "::error::apksigner not found"; exit 1; fi
          echo "BUILD_TOOLS=$BT" >> "$GITHUB_ENV"
          echo "Using build-tools: $(basename "$BT")"

      # G1-7: build the web app (zunva/apps/web) that the APK serves from its assets.
      - name: Set up pnpm 10.28.0 (from zunva/package.json packageManager)
        uses: pnpm/action-setup@v4
        with:
          package_json_file: zunva/package.json

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: zunva/pnpm-lock.yaml

      - name: Install web dependencies (locked versions)
        working-directory: zunva
        run: pnpm install --frozen-lockfile

      - name: Build web app
        working-directory: zunva
        run: |
          pnpm build
          if [ ! -f apps/web/dist/index.html ]; then echo "::error::zunva/apps/web/dist/index.html missing after build"; exit 1; fi

      # Build runs before the secret check so a build problem is visible even before secrets exist.
      - name: Build unsigned release APK
        working-directory: android
        run: bash ./gradlew :app:assembleRelease --no-daemon --stacktrace -PartioWebViewDebug=${{ inputs.ban_kiem_tra && 'true' || 'false' }}

      - name: Check that the 4 signing secrets exist (values are not printed)
        env:
          ZUNVA_KEYSTORE_B64: ${{ secrets.ZUNVA_KEYSTORE_B64 }}
          ZUNVA_KEYSTORE_PASSWORD: ${{ secrets.ZUNVA_KEYSTORE_PASSWORD }}
          ZUNVA_KEY_ALIAS: ${{ secrets.ZUNVA_KEY_ALIAS }}
          ZUNVA_KEY_PASSWORD: ${{ secrets.ZUNVA_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ZUNVA_KEYSTORE_B64 ZUNVA_KEYSTORE_PASSWORD ZUNVA_KEY_ALIAS ZUNVA_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name"; missing=1; fi
          done
          exit $missing

      - name: Decode keystore to a temporary file
        env:
          ZUNVA_KEYSTORE_B64: ${{ secrets.ZUNVA_KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s' "$ZUNVA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/zunva-release.jks"
          if [ ! -s "$RUNNER_TEMP/zunva-release.jks" ]; then echo "::error::Keystore decode failed"; exit 1; fi

      - name: Align and sign APK
        env:
          ZUNVA_KEYSTORE_PASSWORD: ${{ secrets.ZUNVA_KEYSTORE_PASSWORD }}
          ZUNVA_KEY_ALIAS: ${{ secrets.ZUNVA_KEY_ALIAS }}
          ZUNVA_KEY_PASSWORD: ${{ secrets.ZUNVA_KEY_PASSWORD }}
        run: |
          IN="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$IN" ]; then echo "::error::Unsigned APK not found"; ls -R android/app/build/outputs/apk || true; exit 1; fi
          mkdir -p dist
          "$BUILD_TOOLS/zipalign" -p -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          # Passwords are read from env (env:NAME), never placed on the command line.
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/zunva-release.jks" \
            --ks-key-alias "$ZUNVA_KEY_ALIAS" \
            --ks-pass env:ZUNVA_KEYSTORE_PASSWORD \
            --key-pass env:ZUNVA_KEY_PASSWORD \
            --out dist/zunva-release.apk \
            "$RUNNER_TEMP/aligned.apk"

      - name: Remove temporary key material
        if: always()
        run: rm -f "$RUNNER_TEMP/zunva-release.jks" "$RUNNER_TEMP/aligned.apk"

      - name: Verify signature, certificate and package name
        run: |
          APK=dist/zunva-release.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/verify.txt"
          PKG="$("$BUILD_TOOLS/aapt" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          VER="$("$BUILD_TOOLS/aapt" dump badging "$APK" | sed -n "s/^package: .*versionCode='\([^']*\)'.*versionName='\([^']*\)'.*/\1 (\2)/p")"
          if [ "$PKG" != "$EXPECTED_PACKAGE" ]; then echo "::error::Package is $PKG, expected $EXPECTED_PACKAGE"; exit 1; fi
          # The web app must be inside the APK.
          if ! unzip -l "$APK" | grep -q ' assets/index.html$'; then echo "::error::assets/index.html missing from APK"; exit 1; fi
          # The certificate SHA-256 digest is public information (it is inside every APK).
          CERT="$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/verify.txt" | sed 's/.*digest: //')"
          if [ -z "$CERT" ]; then echo "::error::No certificate digest found"; exit 1; fi
          {
            echo "## ZUNVA release APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Package | \`$PKG\` |"
            echo "| Version | $VER |"
            echo "| Signer certificate SHA-256 | \`$CERT\` |"
            echo "| APK SHA-256 | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.ban_kiem_tra && 'artio-ban-kiem-tra-apk' || 'zunva-release-apk' }}
          path: dist/zunva-release.apk
          if-no-files-found: error
          retention-days: 14
