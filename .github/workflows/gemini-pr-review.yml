name: Gemini PR Review

# Gemini đọc phần thay đổi của PR và đăng nhận xét bằng tiếng Việt.
# Gọi Gemini tham gia thảo luận: viết bình luận có chữ @gemini trong PR hoặc Issue.
# Cần secret GEMINI_API_KEY (founder tự thêm trong Settings > Secrets and variables > Actions).
# Không bao giờ ghi khóa API vào file này.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Số PR cần Gemini nhận xét lại"
        required: true

# Chỉ xin đúng quyền cần dùng: đọc mã và viết bình luận vào PR.
permissions:
  contents: read
  pull-requests: write
  issues: write

# Mỗi PR chỉ chạy một lượt; lượt cũ bị hủy khi có commit mới (tiết kiệm hạn mức API).
concurrency:
  group: gemini-review-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number }}
  cancel-in-progress: ${{ github.event_name != 'issue_comment' }}

jobs:
  review:
    # Với bình luận: chỉ chạy khi có chữ @gemini, do chủ kho hoặc cộng tác viên viết, không phải bot.
    if: >-
      github.event_name != 'issue_comment' ||
      (contains(github.event.comment.body, '@gemini') &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Gemini nhận xét PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Model mặc định do Google gợi ý (11/2026). Muốn đổi mà không sửa code:
          # Settings > Secrets and variables > Actions > tab Variables > thêm biến GEMINI_MODEL.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          IS_PR: ${{ github.event_name != 'issue_comment' || github.event.issue.pull_request != null }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail

          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "Chưa có secret GEMINI_API_KEY. Founder cần thêm trong Settings > Secrets and variables > Actions."
            exit 1
          fi

          # Lấy nội dung: diff (nếu là PR), tiêu đề, mô tả.
          DIFF_SUBSET=""
          DIFF_NOTE=""
          if [ "$IS_PR" = "true" ]; then
            # Bỏ file khóa phiên bản (máy tạo, rất dài) để Gemini đọc được mã thật.
            FULL_DIFF=$(gh pr diff "$PR_NUMBER" | awk '/^diff --git /{skip = ($0 ~ /(pnpm-lock\.yaml|package-lock\.json|yarn\.lock)$/)} !skip' || true)
            DIFF_SUBSET=$(printf '%s' "$FULL_DIFF" | head -c 60000)
            ALL_FILES=$(gh pr diff "$PR_NUMBER" --name-only || true)
            if [ "${#FULL_DIFF}" -gt 60000 ]; then
              DIFF_NOTE="LƯU Ý: diff dài hơn giới hạn nên đã bị CẮT; không được kết luận file nào bị thiếu chỉ vì không thấy trong diff."
            fi
            DIFF_NOTE="${DIFF_NOTE}
          Danh sách đầy đủ file thay đổi trong PR (file khóa phiên bản không được đưa vào diff):
          ${ALL_FILES}"
          fi
          TITLE=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER" --jq .title)
          BODY_TEXT=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER" --jq '.body // ""' | head -c 6000)

          if [ "$EVENT_NAME" = "issue_comment" ]; then
            # Chế độ thảo luận: đọc các bình luận gần nhất, trả lời bình luận gọi @gemini.
            QUESTION=$(gh api "repos/$GH_REPO/issues/comments/$COMMENT_ID" --jq .body | head -c 8000)
            # --paginate: đọc hết mọi trang, rồi giữ phần mới nhất (tail).
            THREAD=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments?per_page=100" \
              --jq '.[] | "----- [" + .created_at + "] " + .user.login + ":\n" + .body' | tail -c 70000)
            PROMPT=$(cat <<EOF
          Bạn là Gemini, thành viên phản biện độc lập của ZUNVA AI Council, đang thảo luận trên #${PR_NUMBER}: "${TITLE}".
          Thành viên khác: Claude, GPT, Kiro, và founder (người quyết định cuối). Bình luận có thể cùng tên tài khoản founder; hãy dựa vào tiêu đề trong bình luận để biết ai viết.

          Mô tả:
          ${BODY_TEXT}

          Các bình luận trước đó (cũ đến mới, có thể đã bị cắt bớt phần đầu):
          ${THREAD}

          BÌNH LUẬN CẦN TRẢ LỜI (người này gọi @gemini):
          ${QUESTION}

          Yêu cầu:
          - Trả lời đúng bình luận trên, bằng tiếng Việt dễ hiểu với người không phải lập trình viên.
          - Nêu rõ bạn đồng ý hay không đồng ý với từng điểm của Claude, GPT, Kiro (nếu bình luận hỏi), kèm lý do.
          - Không lặp lại nhận xét bạn đã đăng trước đó; chỉ nêu điểm mới hoặc thay đổi lập trường.
          - Tách rõ điều chắc chắn và điều phỏng đoán. Không bịa dữ kiện. Ngắn gọn.

          Phần thay đổi của PR (nếu có):
          ${DIFF_NOTE}

          ${DIFF_SUBSET}
          EOF
            )
          else
            if [ -z "$DIFF_SUBSET" ]; then
              echo "PR không có thay đổi."
              exit 0
            fi
            PROMPT=$(cat <<EOF
          Bạn là thành viên phản biện của ZUNVA AI Council. Hãy nhận xét PR #${PR_NUMBER}: "${TITLE}".

          Mô tả PR (có thể chứa đề bài phản biện, hãy trả lời đề bài nếu có):
          ${BODY_TEXT}

          Yêu cầu:
          - Trả lời bằng tiếng Việt, dễ hiểu với người không phải lập trình viên.
          - Nếu PR là mã: nêu lỗi tiềm ẩn, vấn đề bảo mật, hiệu năng, đề xuất cải thiện.
          - Nếu PR là tài liệu thiết kế: trả lời từng câu trong đề bài, mỗi câu ghi lập trường, dẫn chứng, rủi ro, ước tính chi phí, mức tự tin, điều chưa biết.
          - Tách rõ điều bạn chắc chắn và điều bạn phỏng đoán.
          - Chỉ dựa trên nội dung bên dưới, không bịa thêm dữ kiện.

          Phần thay đổi (diff):
          ${DIFF_NOTE}

          ${DIFF_SUBSET}
          EOF
            )
          fi

          # Bật Google Search cho Gemini để tra nguồn thật (ảnh, giấy phép, giá) thay vì trả lời theo trí nhớ.
          PAYLOAD=$(jq -n --arg prompt "$PROMPT" '{contents: [{parts: [{text: $prompt}]}], tools: [{google_search: {}}]}')

          # Khóa gửi qua header, không nằm trên URL.
          # Google đôi khi báo quá tải tạm thời: thử lại tối đa 4 lần, chờ 30, 60, 90 giây.
          REVIEW_TEXT=""
          for attempt in 1 2 3 4; do
            RESPONSE=$(curl -sS -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent" \
              -H "Content-Type: application/json" \
              -H "x-goog-api-key: ${GEMINI_API_KEY}" \
              -d "$PAYLOAD" || true)
            REVIEW_TEXT=$(printf '%s' "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty' 2>/dev/null || true)
            [ -n "$REVIEW_TEXT" ] && break
            echo "Lần $attempt chưa được: $(printf '%s' "$RESPONSE" | jq -r '.error.message // .promptFeedback.blockReason // "không rõ"' 2>/dev/null | head -c 200)"
            # Lỗi không tự hết (sai khóa, sai model, yêu cầu sai): dừng ngay, không chờ thử lại.
            CODE=$(printf '%s' "$RESPONSE" | jq -r '.error.code // 0' 2>/dev/null || echo 0)
            case "$CODE" in 400|401|403|404) break;; esac
            [ "$attempt" -lt 4 ] && sleep $((attempt * 30))
          done
          if [ -z "$REVIEW_TEXT" ]; then
            echo "Không nhận được nhận xét từ Gemini. Lỗi trả về:"
            printf '%s' "$RESPONSE" | jq -r '.error.message // .promptFeedback.blockReason // "không rõ"'
            exit 1
          fi

          BODY_FILE=$(mktemp)
          {
            if [ "$EVENT_NAME" = "issue_comment" ]; then
              echo "### Gemini trả lời thảo luận (gọi bằng @gemini, model \`${GEMINI_MODEL}\`)"
            else
              echo "### Gemini nhận xét (gọi tự động qua API, model \`${GEMINI_MODEL}\`)"
            fi
            echo
            printf '%s\n' "$REVIEW_TEXT"
            echo
            echo "---"
            echo "_Ý kiến của Gemini, chưa được founder duyệt. Theo Giao thức AI Council: transport=tool (GitHub Actions)._"
          } > "$BODY_FILE"
          gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" -F "body=@$BODY_FILE" --jq .html_url
